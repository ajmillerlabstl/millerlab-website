name: on-drafts
run-name: On push to drafts

on:
  # run on commit to drafts branch (e.g. Pages CMS saves from lab members)
  push:
    branches:
      - drafts

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Open approval pull request if none is open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # nothing to approve when drafts has no commits main lacks
          ahead=$(gh api "repos/$GH_REPO/compare/main...drafts" --jq .ahead_by)
          [ "$ahead" = "0" ] && exit 0

          number=$(gh pr list --head drafts --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh pr create --head drafts --base main \
              --title "Drafts waiting for approval" \
              --body "Changes saved as drafts in Pages CMS. Check the preview links the bot posts below, then click **Merge pull request** to publish them to the live site. More saves to drafts are added to this pull request automatically.")
            # approvers hear about it from drafts-reminder, at most once a day
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  # pull request workflows started by the workflow token wait for manual approval,
  # so build the preview here on every save (deploy-preview picks it up)
  build-preview:
    needs: open-pr
    if: needs.open-pr.outputs.number != ''
    uses: ./.github/workflows/build-preview.yaml
    with:
      number: ${{ needs.open-pr.outputs.number }}
      ref: drafts

  comment-changes:
    needs: open-pr
    if: needs.open-pr.outputs.number != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout drafts branch contents
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: List changed pages with preview links
        env:
          PREVIEW: ${{ steps.pages.outputs.base_url }}/preview/pr-${{ needs.open-pr.outputs.number }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.open-pr.outputs.number }}
        run: python .github/preview_links.py "$PREVIEW" "$PR_URL" > changes.md

      - name: Comment changed pages on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: changed-pages
          number: ${{ needs.open-pr.outputs.number }}
          path: changes.md
