name: shrink-images
run-name: Shrink uploaded images

on:
  # called by on-push, before the site is built
  workflow_call:

  # run manually by user
  workflow_dispatch:

permissions:
  contents: write

# one at a time, so two quick saves don't both try to commit
concurrency:
  group: shrink-images
  cancel-in-progress: false

jobs:
  shrink-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: python -m pip install pillow

      # checks every image (takes seconds), so a photo missed by an earlier run is caught by the next
      - name: Shrink images
        run: python _scripts/shrink_images.py

      - name: Commit shrunk images to main branch
        run: |
          git add images
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Shrink uploaded images"
          # someone may have saved in Pages CMS meanwhile; catch up and retry
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch || github.ref_name }}" && git push && exit 0
            sleep 5
          done
          exit 1
