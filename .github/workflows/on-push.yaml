name: on-push
run-name: On push to main

on:
  # run on commit to main branch
  push:
    branches:
      - main

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  shrink-images:
    uses: ./.github/workflows/shrink-images.yaml

  # look up any newly added DOIs (runs after shrinking, so the two don't commit at once)
  update-citations:
    needs: shrink-images
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  # build last, so the site uses the smaller images and new citations
  build-site:
    needs: [shrink-images, update-citations]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-site.yaml
