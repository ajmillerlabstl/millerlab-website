name: on-push
run-name: On push to main

on:
  # run on commit to main branch
  push:
    branches:
      - main

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  build-site:
    uses: ./.github/workflows/build-site.yaml

  # bring drafts up to date with main, e.g. after drafts are approved and merged
  sync-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update drafts branch
        run: |
          git ls-remote --exit-code --heads origin drafts > /dev/null || exit 0
          git fetch origin drafts
          main=$(git rev-parse HEAD)

          # no pending drafts: move drafts to main
          if git merge-base --is-ancestor origin/drafts HEAD; then
            git push origin "$main:refs/heads/drafts"
            exit 0
          fi

          # pending drafts: merge main in so editors see the latest site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B drafts origin/drafts
          if git merge --no-edit "$main"; then
            git push origin drafts
          else
            git merge --abort
            echo "::warning::drafts conflicts with main; resolve it in the drafts pull request"
          fi
