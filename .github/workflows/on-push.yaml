name: on-push
run-name: On push to main

on:
  # run on commit to main branch
  push:
    branches:
      - main

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  shrink-images:
    uses: ./.github/workflows/shrink-images.yaml

  # build after shrinking, so the site uses the smaller images
  build-site:
    needs: shrink-images
    uses: ./.github/workflows/build-site.yaml
