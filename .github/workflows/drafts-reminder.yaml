name: drafts-reminder
run-name: Remind approvers about waiting drafts

on:
  # weekday mornings, 8am Central (7am in winter)
  schedule:
    - cron: "0 13 * * 1-5"

  # run manually by user
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # GitHub usernames to remind; mentioning them sends one email each
  APPROVERS: hanlonmt

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Mention approvers if drafts are waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --head drafts --base main --state open --json number --jq '.[0].number')
          [ -z "$number" ] && exit 0

          files=$(gh pr view "$number" --json files --jq '.files | length')
          saves=$(gh pr view "$number" --json commits --jq '[.commits[] | select(.messageHeadline | test("via Pages CMS"))] | length')
          mentions=$(printf '@%s ' $APPROVERS)

          gh pr comment "$number" --body "$mentions— drafts are waiting for approval: $saves save(s) in Pages CMS, $files file(s) changed. See **Pages changed in these drafts** above for preview links, then click **Merge pull request** to publish."
