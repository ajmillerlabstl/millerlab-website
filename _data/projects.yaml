- title: "High dimensional phenomics and automation to transform cost and timeframe of early stage domestication of new crops"
  short_title: Phenomics for new crops
  label: Phenomics · new crops
  summary: Phenomics and automation to speed early-stage domestication of new perennial crops.
  image: images/research/img-0599.jpg
  image_caption: Perennial grain crop intermediate wheatgrass (tradename Kernza) on the phenotyper at the Danforth Plant Science Center.
  people: "PI: Allison Miller. Co-PIs: Lee DeHaan (The Land Institute), Luis Diaz-Garcia (INIFAP), Jesse Poland (Kansas State University), Matthew Rubin (Danforth Plant Science Center), Brandon Schlautman (The Land Institute), Kathryn Turner (The Land Institute), David Van Tassel (The Land Institute)."
  description: |
    A new generation of crops are needed to diversify the economies of farmers and the biology of farm landscapes. Novel crop development could accelerate by adopting breeding value prediction models; indeed, genomic selection in a perennial cereal grain reduced breeding cycles to a single year. However, genome-wide genotyping requires considerable up-front and annual investment and may not be the best option for a diversity of early stage candidates with complex genomes. This project explores the feasibility of phenomics to fundamentally accelerate new crop development through phenomic selection based on phenomics-estimated breeding values (PEBVs). Recent research suggests that with sufficient phenotypic dimensionality breeding values can be predicted in the same way as with genomic selection, using a kinship matrix. Phenomics could also enable accurate, early stage selection for important later-stage traits. This project targets three emerging perennial crops: intermediate wheatgrass (*Thinopyrum intermedium*), sainfoin (*Onobrychis viciifolia*), and silphium (*Silphium integrifolium*); however, our vision is that insights gained and tools developed will be applicable to a range of species. The proposed work re-imagines innovations in plant traits, kinship matrices, genomic selection, phenotyping centers, and ultimately domestication, in order to expedite the development of an emerging generation of climate resilient, ecologically sustainable crops.
  funding: Foundation for Food and Agriculture Research, Seeding Solutions program, Next Generation Crops Challenge Area (CA20-SS-0000000123).
  current: true

- title: "New Roots for Restoration Biology Integration Institute"
  short_title: New Roots for Restoration
  label: Restoration · soil
  summary: Integrating plant traits, communities, and the soil ecosphere to advance restoration of natural and agricultural systems.
  image: images/research/img-9636-2.jpg
  image_caption: Konza Prairie in Kansas.
  people: "PI: Allison Miller. Executive Team: Ivan Baxter (Danforth Plant Science Center), Jim Bever (University of Kansas), Kris Callis-Duehl (Danforth Plant Science Center), Tim Crews (The Land Institute), Kay Havens (Chicago Botanic Garden), Ruth Kaggwa (Danforth Plant Science Center), Sarah Lovell (University of Missouri), Eric von Wettberg (University of Vermont)."
  website: http://www.newrootsforrestoration.org/
  description: |
    Through their root systems, plants connect aboveground components of terrestrial ecosystems to the soil, yet we lack a basic understanding of how plant traits, from shoots to roots, govern these connections. The New Roots for Restoration Biology Integration Institute focuses on the overarching theme of understanding plant organismal systems (including above- and below-ground phenotypes), in the context of plant communities and the soil ecosphere. The Institute engages researchers from disparate disciplines (agro-ecology, community ecology, computer science, genetics, plant biology, restoration, soil microbial ecology, soil science), research contexts (natural and agricultural systems), and organizations (non-profit research institutes, universities, and botanical gardens).

    Scientific activities of the Institute focus on wild species and early stage perennial domesticates in three plant families (sunflower – Asteraceae, bean – Fabaceae, and grass – Poaceae) and take place in natural and emerging agricultural systems. Using field and greenhouse experiments, we apply cutting edge plant phenotyping approaches typically used in major crops to characterize how above- and below-ground traits vary across individuals, populations, species, communities, and sites, and how root and shoot relationships shift based on abiotic and biotic properties of the soil. We leverage existing long-term projects to jump start research and establish novel experiments in a series of tightly coordinated research activities, all of which are supported by Institute Expertise Cores that provide technical training and data consistency across projects.

    The long-term goal of the Institute is to understand how plant traits shape soil properties and vice versa. The work has broad implications for restoration of soil across terrestrial ecosystems. Recognizing that restoration requires a diverse, nimble workforce that spans disciplines, this Institute establishes education, training, diversifying, and outreach intentionally designed with many points of entry and ready mobility across labs and institutions.
  funding: "National Science Foundation Biology Integration Institute [2120153](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2120153&HistoricalAwards=false)."
  current: true

- title: "Adapting perennial crops for climate change: graft-transmissible effects of rootstocks on grapevine shoots"
  short_title: Grapevine rootstocks and climate
  label: Vitis · grafting
  summary: How rootstocks shape grapevine shoots, and how grafting can help perennial crops adapt to a changing climate.
  image: images/research/img-9398.jpg
  image_caption: Rootstock experimental vineyard at University of Missouri South Farm.
  people: "PI: Allison Miller. Co-PIs: Dan Chitwood; Anne Fennell (South Dakota State University); Misha Kwasniewski (University of Missouri); Jason Londo (USDA Agricultural Research Service, Grape Genetics Research Unit, Geneva, NY); Laszlo Kovacs (Missouri State University); Qin Ma (South Dakota State University)."
  website: http://www.vitisunderground.org/
  description: |
    How do long-lived plants cope with a shifting climate, over seasons, and from year to year? What mechanisms enable perennial plants to adjust to changes in their abiotic environment, and how does gene activity in the root system contribute to plasticity at a whole plant level? In perennial woody crops, including grapevine and most fruit and nut trees, grafting is used to maintain elite heterozygote scion cultivars by manipulating long distance signaling through the creation of chimeras. Grafting separates the breeding of shoots from roots, enabling the development, clonal propagation, and distribution of perennial crops into diverse environments.

    This project uses grafted grapevines and genomic resources to produce a systems-level understanding of how rootstocks modify scion phenotype and plasticity. The project focuses on root and shoot interactions by leveraging: 1) an existing common garden research vineyard in Missouri, to analyze inter-annual phenotypic variation in a common scion growing ungrafted and also grafted to three different rootstocks; 2) commercial vineyards across disparate environments of California, to assay environmental influences on root-shoot communication measured in four rootstock-scion combinations; 3) a new segregating rootstock mapping population replicated in four climatic zones and grafted with a common scion, to characterize genotype x environment interactions of scion phenotypes modulated by the root; and 4) academic and industry partnerships, to conduct extensive training and outreach.
  funding: "Previously supported by the National Science Foundation Plant Genome Research Program [1546869](http://www.nsf.gov/awardsearch/showAward?AWD_ID=1546869&HistoricalAwards=false), the Missouri Grape and Wine Institute, the National Geographic Society, National Science Foundation (Grape RCN to Laura Klein), Saint Louis University Center for Sustainability, and the Saint Louis University Presidential Research Fund."
  current: false

- title: "Perennial trait covariation (PCovar)"
  short_title: Perennial trait covariation
  label: Trait covariation
  summary: How perennial herbaceous species balance seed production against vegetative growth, and how traits covary across life stages.
  image: images/research/img-9423-1.jpg
  people: "PI: Allison Miller. Co-PI: Matthew Rubin (Danforth Center). Part of Global Inventory Phase II: Growing the botanical foundation for perennial herbaceous crop development."
  description: |
    A fundamental question in plant evolutionary biology is how species that live for multiple years balance resource allocation to sexual reproduction (seed production) relative to vegetative growth including perennating structures (Friedman and Rubin 2015). One component of this is understanding how reproductive output covaries with vegetative traits (e.g., stem thickness, leaf number, leaf thickness, physiology, root biomass, etc.), how these relationships shift from one year to the next, how they vary under different environmental conditions, and how they change in response to strong selection for increased reproduction output. The direction and magnitude of trait correlations can constrain or enhance response to artificial or natural selection (Cheverud 1984; Agrawal and Stinchcombe 2009). Despite the importance of trait correlations in the response to selection, there are few comprehensive studies that describe the relationship between traits expressed at early life stages (e.g., seed size and weight, germination timing, germination rate) with traits expressed later in life (e.g., reproductive output, root/shoot biomass ratio in Y1, Y2, Y3, etc.). These core questions can provide key insights into how perennial, herbaceous species evolve under artificial selection, and may expedite pre-breeding and domestication if early life-stage traits correlate with desirable traits expressed at later life stages.
  funding: The Perennial Agriculture Project in conjunction with the Malone Family Land Preservation Foundation and The Land Institute, and the Danforth Plant Science Center.
  current: false

- title: "Global inventory (Phase I) and systematic evaluation of perennial grain, legume, and oilseed species for pre-breeding and domestication"
  short_title: Global inventory of perennial crop candidates
  label: Perennial agriculture
  summary: Systematically evaluating wild perennial grain, legume, and oilseed species as candidates for domestication.
  image: images/research/9740812.jpg
  image_caption: Prairie at The Land Institute, Salina, KS.
  description: |
    The long-term goal of this project is to advance sustainable agriculture and ecosystem security through the incorporation of herbaceous and shrubby perennial grain, legume, and oilseed species into large-scale contemporary agriculture (Jackson 1980; Glover et al. 2010). Because perennial grain, legume, and oilseed-producing species are not well-represented among contemporary domesticates (Van Tassel et al. 2010), targeted breeding programs in wild, previously undomesticated species offer one major pathway to the development of perennial crops. The project represents a collaboration between The Perennial Agriculture Project in conjunction with the Malone Family Land Preservation Foundation and The Land Institute (Salina, KS), Saint Louis University (St. Louis, MO), and the Missouri Botanical Garden (St. Louis, MO) that aims to systematically evaluate wild, perennial herbaceous and shrubby grain, legume, and oilseed species for inclusion in pre-breeding and domestication programs. Promising candidates for pre-breeding and domestication will be identified by extracting and analyzing information obtained from available sources (literature, on-line databases, herbaria and living collections), by collecting and planting out a subset of taxa for live-plant analysis in The Land Institute greenhouses and fields, and by developing long-term experiments designed to test evolutionary theory related to how perennial plants respond to artificial selection.
  funding: The Land Institute (Perennial Agriculture Project in conjunction with the Malone Family Land Preservation Foundation), the Saint Louis University Center for Sustainability, and a Saint Louis University Graduate Assistantship.
  current: false

- title: "Below-ground perspectives on biodiversity: root systems, comparative genomics, and domestication of North American grapevines"
  short_title: Roots and domestication
  label: Roots · genomics
  summary: Whole genome sequencing of the North American grapevine species used as rootstocks around the world.
  image: images/site/footer.jpg
  description: |
    Our work in *Vitis* focuses on a subset of the North American species, a charismatic part of the regional flora and a key component of global viticulture. Although only a few North American species are cultivated for wine or table grapes, the main uses of North American grapevines are as contributors to hybrid scions (e.g., ‘Chambourcin’, ‘Vidal Blanc’), and as rootstocks to which *V. vinifera* cultivars are grafted (e.g., *Vitis riparia* ‘Gloire’, *Vitis rupestris* ‘Saint George’). Grafting in grapevine dates back to the mid-1800’s when the North American *Phylloxera* aphid was introduced into Europe and devastated the French grape industry, subsequently spreading across Europe and the world. As a result, vineyards across the globe now consist of European *V. vinifera* grafted to biotic and abiotic stress resistant North American *Vitis* species: the riverbank grape (*V. riparia*), the rock grape (*V. rupestris*), Heller’s grape (*V. cinerea* ssp. *helleri*) and their hybrid derivatives are used nearly exclusively as rootstocks. Ongoing work in the lab uses whole genome sequencing to characterize natural variation in grapevine species used for rootstocks.
  funding: National Geographic Society and The Living Earth Collaborative at Washington University.
  current: false

- title: "Geographic patterns of genetic and morphological variation in threatened Mascarene Diospyros (Ebenaceae)"
  short_title: Mascarene Diospyros conservation
  label: Diospyros · conservation
  summary: Genetic and morphological variation in threatened ebony species of the Mascarene Islands.
  image: images/research/4616471.jpg
  image_caption: "Collecting Diospyros in Mauritius. Photo: Alex Linan."
  description: |
    The ebony and persimmon genus (*Diospyros*) is a diverse group of largely tropical trees and shrubs that comprises between 500 and 700 species distributed on six continents, many of which are poorly known, remain to be described, or of dire conservation concern. Although some species in the genus are widespread and economically important (e.g., persimmons such as *Diospyros kaki*, *D. lotus*, and *D. virginiana*), many species are rare, over-exploited, or poorly known; indeed, recent field studies and taxonomic work suggests there may be as many as 130 undescribed species in Madagascar alone. This work focuses on *Diospyros* in the Mascarene Islands. The Mascarene Islands comprise three volcanic islands in the western Indian Ocean (Mauritius, Reunion, Rodrigues) that have a largely endemic flora where the majority of native, endemic species are threatened or already extinct. For example, Mauritius has 315 endemic plant species, of which 200 are threatened and 50 are known from fewer than 10 individuals in the wild. Within the genus *Diospyros*, 14 species are endemic to the Mascarene Islands, of which one species is thought to be extinct, four of which are listed as Critically Endangered, and seven of which are listed as Vulnerable. Although many of these species are of utmost conservation concern, very little is known about patterns of genetic and morphological variation within species, even though such knowledge is critical for developing conservation strategies. This work was carried out by Alex Linan, PhD student jointly advised by Christy Edwards, Conservation Geneticist at the Missouri Botanical Garden.
  funding: American Society of Plant Taxonomists, National Geographic Society, and a Saint Louis University Graduate Assistantship.
  current: false

- title: "Rootstock impacts on shoot system phenotypes in Pongamia"
  short_title: Pongamia rootstocks
  label: Pongamia · rootstocks
  summary: Developing stress-resistant rootstocks for pongamia, a hardy legume tree crop, with TerViva.
  image: images/research/img-0062.jpg
  website: https://in2ecosystem.com/companies/terviva/
  description: |
    TerViva is commercializing climate-resilient pongamia trees. The pongamia is a hardy legume tree that produces an annual crop of beans with up to 10 times the yield of soy, for over 25 years. TerViva is increasing the global supply of plant protein and vegetable oil while restoring degraded agricultural land. TerViva will work with Dr. Allison Miller of the Donald Danforth Plant Science Center to develop stress-resistant rootstocks, thereby expanding environments in which pongamia can be a viable high-yielding crop.

    The goals of this study are to assess 1) the impact of grafting on Pongamia root and shoot systems – how much phenotypic variation does grafting introduce? Is this a result of the blunt trauma of grafting itself, or is it due to genotype-specific effects of different root/shoot combinations? 2) how grafting, and how specific root/shoot combinations, fare through stress treatments (drought, high/low nitrogen).
  funding: Wells Fargo Innovation Incubator (IN2).
  current: false

