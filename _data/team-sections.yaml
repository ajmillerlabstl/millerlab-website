# sections of the team page, in the order they appear
# each section shows the members whose "role" (in _members/*.md) is in its roles list
# "current" sections show current members; "alumni" sections show members with "group: alum"
# a section with nobody in it is hidden automatically

current:
  - title: ""
    roles: [principal-investigator]
  - title: Research Scientists and Postdoctoral Researchers
    roles: [research-scientist, postdoc]
  - title: Research Associates
    roles: [research-associate]
  - title: Technicians
    roles: [technician]
  - title: Admins
    roles: [staff]
  - title: Saint Louis University Graduate Students
    roles: [phd, masters]
  - title: Undergraduate Researchers
    roles: [undergrad]
  - title: High School Interns
    roles: [high-school]
  - title: Honorary Lab Members
    roles: [honorary]

alumni:
  - title: Former Research Scientists and Staff
    roles: [principal-investigator, research-scientist, research-associate, staff]
  - title: Former Post-docs
    roles: [postdoc]
  - title: Former Graduate Students
    roles: [phd, masters]
  - title: Former Research Assistants and Lab Technicians
    roles: [technician]
  - title: Former Undergraduates and Interns
    roles: [undergrad]
  - title: Former High School Students
    roles: [high-school]
  - title: Former Honorary Lab Members
    roles: [honorary]
