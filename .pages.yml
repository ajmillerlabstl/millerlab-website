# Pages CMS configuration — gives lab members simple forms for editing the site.
# Sign in at https://app.pagescms.org with GitHub and open this repository.
settings:
  # record who saved each change: email-invited editors otherwise show only as pages-cms[bot]
  commit:
    identity: user
    templates:
      create: "Create {path} (via Pages CMS, by {userEmail})"
      update: "Update {path} (via Pages CMS, by {userEmail})"
      delete: "Delete {path} (via Pages CMS, by {userEmail})"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS, by {userEmail})"

media:
  input: images
  output: /images
  # web-friendly types only (iPhone HEIC photos don't show in most browsers); big photos are shrunk on save.
  # Pages CMS matches extensions case-sensitively, so camera-style uppercase (.JPG) is listed too.
  extensions: &image-types [jpg, JPG, jpeg, JPEG, png, PNG, webp, WEBP, gif, GIF, svg, SVG]

content:
  - name: posts
    label: News & Blog
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      sort: [date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: author, label: Author (member file name, e.g. allison-miller), type: string }
      - { name: image, label: Image, type: image, options: { extensions: *image-types } }
      - { name: tags, label: "Tags (e.g. news, lab blog)", type: string }
      - { name: body, label: Text, type: rich-text }

  - name: members
    label: Lab Members
    type: collection
    path: _members
    view:
      fields: [name, role, group]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: image, label: Photo, type: image, options: { extensions: *image-types } }
      - name: role
        label: Role
        type: select
        options:
          values: [principal-investigator, research-scientist, research-associate, postdoc, phd, masters, technician, staff, undergrad, high-school, honorary]
      - { name: description, label: "Title and years, e.g. Lab Technician (2025 - present). Keep it short; the bio goes below.", type: string }
      - name: group
        label: Current member or alum?
        type: select
        options:
          values: ["", alum]
      - name: links
        label: Links
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: orcid, label: "ORCID iD, e.g. 0000-0002-1825-0097", type: string }
          - { name: google-scholar, label: "Google Scholar ID: the part after user= in your profile link", type: string }
          - { name: linkedin, label: "LinkedIn: the part after linkedin.com/in/", type: string }
          - { name: bluesky, label: "Bluesky handle, e.g. name.bsky.social", type: string }
          - { name: home-page, label: "Personal website (full link)", type: string }
      - { name: body, label: Bio, type: rich-text }

  - name: publications
    label: Publications (DOI list)
    type: collection
    path: _papers
    # one file per paper, named after its DOI
    filename: "{id}.md"
    view:
      fields: [note, id]
      primary: note
      sort: [note, id]
      default:
        sort: note
        order: desc
    # every key used in a paper file is listed here, so saving through the form can't drop any of them
    fields:
      - { name: id, label: "DOI, written as doi:10.xxxx/xxxxx", type: string }
      - { name: note, label: "Year · first author · title (filled in automatically after saving; leave blank)", type: string }
      - name: tags
        label: Topics
        type: select
        options:
          multiple: true
          values: [Conservation, Domestication, Fruit & Nut Trees, Genomics, Kernza, Perennial Crops, Phenomics, Plant Diversity, Root Biology, Silphium, Vitis]
      - name: buttons
        label: "Extra links shown under the paper (data, code, media coverage, video…)"
        type: object
        list: true
        fields:
          - name: type
            label: Kind of link (sets the icon)
            type: select
            options:
              values:
                - { name: data, label: "Data (Zenodo, Dryad, Figshare…)" }
                - { name: source, label: "Code (GitHub…)" }
                - { name: media, label: "Media coverage (news story, press release, blog)" }
                - { name: youtube, label: "Video" }
                - { name: website, label: "Other link" }
          - { name: text, label: "Button text, e.g. Data on Zenodo (optional)", type: string }
          - { name: link, label: Web address (full link), type: string }
      - { name: abstract, label: "Abstract (only needed if one doesn't appear on the site by itself)", type: text }
      - { name: remove, label: "Hide this paper from the site", type: boolean }

  # one entry per page. page text is plain markdown (not rich text) so the {% include %} codes in it survive.
  # nav and redirect_from are listed so saving a page through the form keeps its menu entry and old-site link.
  - name: home
    label: "Page: Home"
    type: file
    path: index.md
    fields:
      - { name: layout, label: "Layout (leave as home)", type: string, hidden: true, default: home }
      - { name: hero_title, label: "Headline (wrap a word in <em></em> to color it)", type: string }
      - { name: hero_text, label: Text under the headline, type: text }
      - name: institutions
        label: Institution boxes in the About section
        type: object
        list: true
        fields:
          - { name: label, label: "Small label, e.g. Where the lab is based", type: string }
          - { name: name, label: Institution name, type: string }
          - { name: text, label: Text, type: text }
          - { name: link, label: Web address, type: string }
          - { name: link_text, label: "Link text, e.g. danforthcenter.org", type: string }
      - { name: body, label: "About the lab text (markdown)", type: text }

  - name: gallery
    label: Home page gallery
    type: file
    path: _data/gallery.yaml
    format: yaml
    # the photos sit under an "items" key in the file so each one can be titled by its caption when collapsed
    fields:
      - name: items
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - { name: image, label: "Photo (landscape, at least 1600 px wide)", type: image, options: { input: images/gallery, output: images/gallery, extensions: *image-types } }
          - { name: caption, label: Caption shown under the photo, type: string }
          - { name: alt, label: "Description for screen readers (what's in the photo)", type: string }

  - name: projects
    label: Research projects
    type: file
    path: _data/projects.yaml
    format: yaml
    # the projects sit under an "items" key in the file so each one can be titled by its short name when collapsed
    fields:
      - name: items
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{short_title}"
        fields:
          - { name: title, label: Project name, type: string }
          - { name: short_title, label: "Short name, shown on the home page card and the Research page index", type: string }
          - { name: label, label: "Keywords for the card, e.g. Vitis · grafting", type: string }
          - { name: summary, label: One or two sentence summary for the home page card, type: text }
          - { name: image, label: Photo, type: image, options: { extensions: *image-types } }
          - { name: image_caption, label: Photo caption, type: string }
          - { name: people, label: "People, e.g. PI: Allison Miller. Co-PIs: …", type: text }
          - { name: website, label: Project website (full web address), type: string }
          - { name: description, label: "Full description for the Research page (markdown)", type: text }
          - { name: funding, label: Funding, type: text }
          - { name: current, label: "Current project (shown on the home page; untick to move it to Previous projects)", type: boolean }

  - name: research
    label: "Page: Research"
    type: file
    path: research/index.md
    fields: &page-fields
      - { name: title, label: Title, type: string }
      - { name: header, label: Banner photo, type: image, options: { extensions: *image-types } }
      - name: nav
        label: Menu
        type: object
        fields:
          - { name: order, label: Position in menu, type: number }
          - { name: tooltip, label: Menu tooltip, type: string }
          - { name: highlight, label: Show as a highlighted button, type: boolean }
      - { name: redirect_from, label: "Old-site address that should land here (leave as is)", type: string }
      - { name: body, label: "Page text (markdown)", type: text }
  - { name: team-page, label: "Page: Team (intro text)", type: file, path: team/index.md, fields: *page-fields }
  - { name: publications-page, label: "Page: Publications", type: file, path: publications/index.md, fields: *page-fields }
  - { name: teaching, label: "Page: Teaching", type: file, path: teaching/index.md, fields: *page-fields }
  - { name: outreach, label: "Page: Outreach", type: file, path: outreach/index.md, fields: *page-fields }
  - { name: media, label: "Page: Media", type: file, path: media/index.md, fields: *page-fields }
  - { name: photos, label: "Page: Photos", type: file, path: photos/index.md, fields: *page-fields }
  - { name: join-us, label: "Page: Join Us", type: file, path: join-us/index.md, fields: *page-fields }
